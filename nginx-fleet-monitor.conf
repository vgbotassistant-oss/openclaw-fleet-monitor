limit_req_zone $binary_remote_addr zone=fleet:10m rate=10r/s;

server {
    listen 80;
    server_name vgbots.duckdns.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name vgbots.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/vgbots.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vgbots.duckdns.org/privkey.pem;

    auth_basic "Fleet Monitor";
    auth_basic_user_file /etc/nginx/.htpasswd-fleet;

    limit_req zone=fleet burst=20 nodelay;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /ws {
        proxy_pass http://127.0.0.1:18789;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location /health {
        auth_basic off;
        proxy_pass http://127.0.0.1:8081/health;
    }
}